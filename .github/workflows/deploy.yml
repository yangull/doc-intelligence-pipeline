name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: doc-intelligence-dev
  ECS_CLUSTER: doc-intelligence-dev
  ECS_SERVICE: doc-intelligence-api-dev
  ECS_WORKER_SERVICE: doc-intelligence-worker-dev
  CONTAINER_NAME: api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::549116506173:role/doc-intelligence-github-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Both services run the same image, so both need forcing onto the new :latest.
      # Without the worker line it would keep serving whatever image it launched with.
      # These are no-ops while a service sits at desired_count = 0.
      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment --region ${{ env.AWS_REGION }}

          # The worker service is newer than this workflow. Until `terraform apply`
          # creates it, update-service would exit non-zero and fail the job *after*
          # the API had already been redeployed — a red build on a half-applied
          # deploy. Warn and continue instead; the next push picks it up.
          WORKER_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_WORKER_SERVICE }} \
            --region ${{ env.AWS_REGION }} --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$WORKER_STATUS" = "ACTIVE" ]; then
            aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_WORKER_SERVICE }} --force-new-deployment --region ${{ env.AWS_REGION }}
          else
            echo "::warning::Worker service ${{ env.ECS_WORKER_SERVICE }} not found (status=$WORKER_STATUS). Run 'terraform apply' to create it; skipping its redeploy."
          fi
